name: Run Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: ["8", "11", "17", "21", "23", "24", "25", "26", "27"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Gradle runtime JDK
        id: runtime-jdk
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Set up target JDK
        id: target-jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          # Temurin has not published a JDK 27 package yet; Zulu provides it.
          distribution: ${{ matrix.java == '27' && 'zulu' || 'temurin' }}
      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.2.1
      - name: Test
        env:
          JAVA_HOME: ${{ steps.runtime-jdk.outputs.path }}
          TARGET_JAVA_VERSION: ${{ matrix.java }}
          TARGET_JAVA_HOME: ${{ steps.target-jdk.outputs.path }}
        run: |
          ./gradlew \
            -PtargetJavaVersion=$TARGET_JAVA_VERSION \
            -Dorg.gradle.java.installations.paths=$TARGET_JAVA_HOME \
            :lib:test
